# ============================================
# Cloud Notes App - Docker Compose
# ============================================
# One command brings up the whole stack:
#   docker compose up -d --build
#
# Host Nginx (on EC2) terminates SSL and proxies to these containers.
# Both ports bind to 127.0.0.1 only — they're not reachable from the internet,
# only from the host's Nginx. This is the production-safe pattern.

services:

  # ----------------------------------------
  # Backend - Node.js + Express API
  # ----------------------------------------
  backend:
    build: ./backend
    container_name: cloudnotes-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 5000
    ports:
      # Bind to localhost only - host Nginx reaches it via 127.0.0.1:5000
      - "127.0.0.1:5000:5000"
    networks:
      - cloudnotes-net

  # ----------------------------------------
  # Frontend - React static files served by Nginx (inside container)
  # ----------------------------------------
  frontend:
    build: ./frontend
    container_name: cloudnotes-frontend
    restart: unless-stopped
    ports:
      # Bind to localhost only - host Nginx reaches it via 127.0.0.1:3000
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - cloudnotes-net

networks:
  cloudnotes-net:
    driver: bridge
