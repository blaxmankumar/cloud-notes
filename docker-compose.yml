services:

  # --------------------------------------------------
  # MySQL Database
  # --------------------------------------------------
  mysql:
    build:
      context: ./database
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME}/cloudnotes-mysql:${IMAGE_TAG:-latest}
    container_name: cloudnotes-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - cloudnotes-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------
  # Node.js Backend
  # --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME}/cloudnotes-backend:${IMAGE_TAG:-latest}
    container_name: cloudnotes-backend
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 5000

    ports:
      - "127.0.0.1:5000:5000"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - cloudnotes-net

  # --------------------------------------------------
  # React Frontend
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${DOCKERHUB_USERNAME}/cloudnotes-frontend:${IMAGE_TAG:-latest}
    container_name: cloudnotes-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - backend

    networks:
      - cloudnotes-net

volumes:
  mysql-data:
    name: cloudnotes-mysql-data

networks:
  cloudnotes-net:
    name: cloudnotes-network
    driver: bridge
