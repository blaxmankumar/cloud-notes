name: Azure DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-devsecops-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_DIRECTORY: terraform/environments/dev

  FRONTEND_DIRECTORY: frontend
  BACKEND_DIRECTORY: backend

  FRONTEND_IMAGE_NAME: cloudnotes-frontend
  BACKEND_IMAGE_NAME: cloudnotes-backend

  TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ==================================================
  # JOB 1: Terraform Azure Infrastructure
  # ==================================================
  terraform:
    name: Create Azure Infrastructure
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    outputs:
      acr_name: ${{ steps.terraform_outputs.outputs.acr_name }}
      acr_login_server: ${{ steps.terraform_outputs.outputs.acr_login_server }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS authentication is required because
      # Terraform state is stored in the AWS S3 backend.
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-cloudnotes-terraform

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure authentication
        run: az account show --output table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform initialize with S3 backend
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read Terraform outputs
        id: terraform_outputs
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        shell: bash
        run: |
          echo "acr_name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      - name: Verify Terraform state in S3
        run: |
          aws s3 ls \
            s3://cloud-notes-tfstate-038832652205/azure-devsecops/dev/

  # ==================================================
  # JOB 2: Build, Trivy Scan and Push Docker Images
  # ==================================================
  build-scan-push:
    name: Build Scan and Push Images
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login \
            --name "${{ needs.terraform.outputs.acr_name }}"

      - name: Generate image tag
        id: image_metadata
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            --tag "${{ needs.terraform.outputs.acr_login_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}" \
            "${{ env.FRONTEND_DIRECTORY }}"

      - name: Build backend image
        run: |
          docker build \
            --tag "${{ needs.terraform.outputs.acr_login_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}" \
            "${{ env.BACKEND_DIRECTORY }}"

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ needs.terraform.outputs.acr_login_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ needs.terraform.outputs.acr_login_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push frontend image to ACR
        run: |
          docker push \
            "${{ needs.terraform.outputs.acr_login_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}"

      - name: Push backend image to ACR
        run: |
          docker push \
            "${{ needs.terraform.outputs.acr_login_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}"

      - name: Show pushed image names
        run: |
          echo "Frontend image:"
          echo "${{ needs.terraform.outputs.acr_login_server }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}"

          echo "Backend image:"
          echo "${{ needs.terraform.outputs.acr_login_server }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.image_metadata.outputs.tag }}"
