# ============================================
# Frontend container Nginx config
# ============================================
# Serves the React static build, and proxies /api/* to the backend
# container via the internal Docker network.
#
# In LOCAL Docker usage (developer machine), this proxy is what makes
# everything work via just http://localhost:3000.
#
# In EC2 PRODUCTION, the host Nginx terminates SSL and proxies /api/*
# directly to the backend container on 127.0.0.1:5000 — bypassing this
# block entirely. That's fine — both paths work; in production this
# block just isn't used.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://cloud-notes-backend-service:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://cloud-notes-backend-service:5000/health;
  }
}
