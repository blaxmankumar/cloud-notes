# ============================================
# Host Nginx config for cloud-notes.aws365.shop
# ============================================
# Place at: /etc/nginx/sites-available/cloudnotes
# Symlink:  sudo ln -s /etc/nginx/sites-available/cloudnotes /etc/nginx/sites-enabled/
#
# On Amazon Linux, drop it in /etc/nginx/conf.d/cloudnotes.conf instead
# (no sites-enabled symlink needed).
#
# Before enabling the HTTPS server blocks, run certbot to get the SSL certs:
#   sudo certbot --nginx -d aws365.shop -d www.aws365.shop
#
# Certbot will automatically edit this file to inject the ssl_certificate lines.

# ----------------------------------------
# HTTP → HTTPS redirect
# ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aws365.shop www.aws365.shop;

    # Let certbot use the .well-known path for HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------
# Apex (aws365.shop) → redirect to www
# ----------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aws365.shop;

    # SSL certs (certbot fills these in)
    ssl_certificate     /etc/letsencrypt/live/aws365.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws365.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.aws365.shop$request_uri;
}

# ----------------------------------------
# Main site: https://www.aws365.shop
# ----------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aws365.shop;

    # SSL certs
    ssl_certificate     /etc/letsencrypt/live/aws365.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws365.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reasonable upload size for notes
    client_max_body_size 1M;

    # Logging
    access_log /var/log/nginx/cloudnotes.access.log;
    error_log  /var/log/nginx/cloudnotes.error.log;

    # ----------------------------------------
    # Frontend (React static files in container)
    # ----------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------
    # Backend API
    # ----------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------
    # Health check
    # ----------------------------------------
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
