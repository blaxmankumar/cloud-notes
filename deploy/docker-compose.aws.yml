services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_MODE: file
      DATA_FILE: /var/lib/cloud-notes/notes.json
      PORT: 5000
      NODE_ENV: production
    volumes:
      - cloud-notes-data:/var/lib/cloud-notes
    networks: [cloud-notes]
    security_opt: [no-new-privileges:true]

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx-verified-access.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [cloud-notes]
    security_opt: [no-new-privileges:true]

networks:
  cloud-notes:
    driver: bridge

volumes:
  cloud-notes-data:
