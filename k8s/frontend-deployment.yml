apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-notes-frontend
  namespace: cloud-notes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-notes-frontend
  template:
    metadata:
      labels:
        app: cloud-notes-frontend
    spec:
      containers:
      - name: frontend
        image: battulalaxmankumar04/cloud-notes-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
